<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三国志大戦 言えるかな？</title>
  <style>
    body { font-family: sans-serif; background: #1a1a1a; color: #fff; text-align: center; margin: 0; padding: 10px; }
    .header { position: sticky; top: 0; background: #2a2a2a; padding: 10px; z-index: 100; border-bottom: 2px solid #444; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    h1 { font-size: 1.3rem; margin: 5px 0; }
    .disclaimer { font-size: 0.65rem; color: #aaa; margin: 5px 0 10px 0; line-height: 1.3; padding: 0 5px; }
    .controls-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; align-items: center; margin-bottom: 8px; font-size: 0.85rem; }
    .control-group { background: #333; padding: 4px 8px; border-radius: 4px; border: 1px solid #555; }
    input[type="text"] { font-size: 1.1rem; padding: 6px 12px; width: 85%; max-width: 280px; border-radius: 4px; border: 1px solid #666; background: #333; color: #fff; text-align: center; }
    button { background: #444; color: #fff; border: 1px solid #666; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
    button:hover { background: #555; }
    select:disabled { opacity: 0.6; cursor: not-allowed; }
    .stats { font-size: 0.9rem; margin-top: 8px; color: #ccc; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; align-items: center; }
    
    .shiki-icon { width: 16px; height: 16px; vertical-align: middle; margin: 0 1px; }
    
    /* 通常カードグリッド（縦長カード用） */
    .card-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(85px, 85px));
      gap: 6px;
      justify-content: center;
      margin-top: 10px;
      padding: 4px;
      max-width: 1400px;
      margin-left: auto;
      margin-right: auto;
    }

    /* 軍師カード選択時（横長カード 108×77 に合わせたグリッド） */
    .card-container.gunshi-mode {
      grid-template-columns: repeat(auto-fill, minmax(116px, 116px));
    }

    .card { background: #2b2b2b; border-radius: 4px; padding: 3px; text-align: center; border: 1px solid #444; overflow: hidden; box-sizing: border-box; }
    .card.cleared { background: #1e3a1e; border-color: #4CAF50; }
    
    /* 通常カードの画像コンテナ（サイズ固定: 77×108） */
    .card-img-wrapper {
      width: 77px;
      height: 108px;
      background: #111;
      border-radius: 2px;
      margin: 0 auto;
      overflow: hidden;
      position: relative;
    }

    /* 軍師カードの画像コンテナ（サイズ固定: 108×77、横向き） */
    .card-container.gunshi-mode .card-img-wrapper {
      width: 108px;
      height: 77px;
    }

    /* 1. 非表示 (裏面) または 正解クリア時 */
    .card-container.mode-hide .card-img-wrapper img,
    .card.cleared .card-img-wrapper img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: fill;
      object-position: center;
      transform: none;
      position: static;
    }

    /* 2. 一部表示: 画像サイズそのままで約500%(5倍)に拡大し、中央を表示 */
    .card-container.mode-partial .card-img-wrapper img:not(.cleared-img) {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
      transform: scale(5);
    }

    /* 3. 全部表示 (通常 1〜3の場合): 右上から 61×93 を切り出し */
    .card-container.mode-full .card-img-wrapper img:not(.cleared-img) {
      position: absolute;
      top: 0;
      right: 0;
      width: 77px;
      height: 108px;
      display: block;
      object-fit: fill;
      clip-path: inset(0 0 15px 16px);
    }

    /* 3-2. 全部表示 (4 の場合): トリミング無効（全体を表示） */
    .card-container.ver4-mode.mode-full .card-img-wrapper img:not(.cleared-img) {
      position: static;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: fill;
      clip-path: none;
    }

    /* 3-3. 全部表示 (軍師 108×77 横向きの場合): 縦横入れ替えたトリミング */
    .card-container.gunshi-mode.mode-full .card-img-wrapper img:not(.cleared-img) {
      position: absolute;
      top: 0;
      right: 0;
      width: 108px;
      height: 77px;
      display: block;
      object-fit: fill;
      clip-path: inset(0 0 12px 18px);
    }

    /* ステータス表示・非表示の切り替えクラス */
    .card-container.hidden-status .card-info { display: none; }
    
    .card-info { font-size: 0.55rem; margin-top: 3px; line-height: 1.15; color: #aaa; word-break: break-all; }
    .card-name { font-weight: bold; color: #ffd700; min-height: 1.2em; font-size: 0.65rem; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    
    .wrong-flash { animation: flash 0.3s ease; }
    @keyframes flash { 0% { background: #600; } 100% { background: #1a1a1a; } }
  </style>
</head>
<body id="body-layout">

  <div class="header">
    <h1>三国志大戦 言えるかな？</h1>
    <div class="disclaimer">
      本サイトは非公式二次創作です。本サイトで使用される画像およびデータ等著作物の権利及び一切の知的財産権は株式会社SEGA様に帰属します。
    </div>

    <!-- コントロール群 -->
    <div class="controls-row">
      <div class="control-group">
        <!-- ※ onchange属性を削除し、ゲーム開始後はJSでdisabled制御します -->
        シリーズ: <select id="version-select">
          <option value="1">三国志大戦</option>
          <option value="2">三国志大戦2</option>
          <option value="3">三国志大戦3</option>
          <option value="3_gunshi">三国志大戦3 - 軍師</option>
          <option value="4">三国志大戦4</option>
        </select>
      </div>

      <div class="control-group">
        難易度: <select id="lives-select" onchange="changeLivesMode()">
          <option value="12">1勢力 (残機:12)</option>
          <option value="9">2勢力 (残機:9)</option>
          <option value="6">3勢力以上 (残機:6)</option>
          <option value="none">無し (ミス数カウント)</option>
        </select>
      </div>

      <div class="control-group">
        ステータス: 
        <label><input type="radio" name="status-toggle" value="show" onclick="toggleStatus(true)"> 表示</label>
        <label><input type="radio" name="status-toggle" value="hide" checked onclick="toggleStatus(false)"> 非表示</label>
      </div>

      <div class="control-group">
        イラスト表示:
        <label><input type="radio" name="display-mode" value="hide" checked onclick="changeDisplayMode('hide')"> 非表示</label>
        <label><input type="radio" name="display-mode" value="partial" onclick="changeDisplayMode('partial')"> 一部表示</label>
        <label><input type="radio" name="display-mode" value="full" onclick="changeDisplayMode('full')"> 全部表示</label>
      </div>

      <div class="control-group">
        <label><input type="checkbox" id="bulk-match-checkbox" onchange="saveGameState()"> 同名武将一括正解</label>
      </div>

      <div class="control-group">
        <button onclick="resetGamePrompt()">リセット</button>
      </div>
    </div>

    <div class="stats">
      <span>正解: <span id="score">0</span>/<span id="total-count">0</span></span>
      <span id="lives-display-container">残機: <span id="lives-icons-container"></span></span>
      <span id="miss-display-container" style="display: none;">ミス: <span id="miss-count" style="color: #ff6b6b; font-weight: bold;">0</span>回</span>
      <span>⏱ <span id="timer">00:00</span></span>
    </div>

    <div style="margin-top: 8px;">
      <input type="text" id="name-input" placeholder="武将名を入力 (例: 呂布)" autofocus autocomplete="off">
    </div>
  </div>

  <div class="card-container mode-hide hidden-status" id="card-grid"></div>

  <script>
    let cardsData = [];
    let initialLives = 12;
    let lives = 12;
    let missCount = 0;
    let isNoLivesMode = false;
    let correctCount = 0;
    let seconds = 0;
    let timerInterval = null;
    let isTimerStarted = false;
    let isGameOver = false;

    function toKatakana(str) {
      return str.replace(/[\u3041-\u3096]/g, function(match) {
        return String.fromCharCode(match.charCodeAt(0) + 0x60);
      });
    }

    function normalizeStr(str) {
      if (!str) return "";
      let s = str.trim().toLowerCase();
      s = toKatakana(s);
      s = s.replace(/[Ａ-Ｚａ-ｚ０-９]/g, function(s) {
        return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
      });
      return s;
    }

    function getCurrentFolder() {
      const ver = document.getElementById("version-select").value;
      if (ver === "1") return "sangokushitaisen1";
      if (ver === "3_gunshi") return "sangokushitaisen3_gunshi";
      return `sangokushitaisen${ver}`;
    }

    function getStorageKey() {
      const ver = document.getElementById("version-select").value;
      return `sangokushi_game_v${ver}`;
    }

    function isGunshiMode() {
      return document.getElementById("version-select").value === "3_gunshi";
    }

    function isVer4Mode() {
      return document.getElementById("version-select").value === "4";
    }

    function loadData() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = null;
      isTimerStarted = false;
      isGameOver = false;
      correctCount = 0;
      seconds = 0;
      missCount = 0;

      const ver = document.getElementById("version-select").value;
      let jsonFile = "sangokushi_cards.json";
      if (ver === "2") jsonFile = "sangokushi_cards_v2.json";
      else if (ver === "3") jsonFile = "sangokushi_cards_v3.json";
      else if (ver === "3_gunshi") jsonFile = "sangokushi_cards_v3_gunshi.json";
      else if (ver === "4") jsonFile = "sangokushi_cards_v4.json";

      const folder = getCurrentFolder();
      const grid = document.getElementById("card-grid");

      grid.classList.remove("gunshi-mode", "ver4-mode");
      if (isGunshiMode()) {
        grid.classList.add("gunshi-mode");
      } else if (isVer4Mode()) {
        grid.classList.add("ver4-mode");
      }

      fetch(jsonFile)
        .then(res => {
          if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
          return res.json();
        })
        .then(data => {
          cardsData = data.map((item, index) => {
            let rawNo = String(item["No"] || (index + 1)).trim();
            let formattedNo = rawNo;
            if (/^\d+$/.test(rawNo)) {
              formattedNo = rawNo.padStart(3, '0');
            }

            const bushoName = String(item["武将名"] || item["名前"] || "").trim();
            const yomi = String(item["ヨミ"] || "").trim();
            const yomiFirstWord = yomi.split(" ")[0] || "";
            
            const imgFileName = `${folder}/${formattedNo}_${yomiFirstWord}.jpg`;

            return {
              displayNo: rawNo,
              noPrefix: formattedNo,
              rarity: item["レアリティ"] || "",
              attribute: item["属性"] || "",
              bushoName: bushoName,
              yomi: yomi,
              yomiFirst: yomiFirstWord,
              power: item["武力"] || "",
              int: item["知力"] || "",
              seiatsu: item["征圧"] || "",
              cost: item["武将コスト"] || item["コスト"] || "",
              strategy: item["計略名"] || item["計略/軍略名"] || "",
              hiryaku: item["兵略"] || "",
              jinryaku: item["陣略"] || "",
              imgPath: imgFileName,
              isCleared: false
            };
          });

          loadGameState();
          initGame();
        })
        .catch(err => {
          console.error("Data load error:", err);
          document.getElementById("card-grid").innerHTML = `
            <div style='grid-column: 1 / -1; margin-top:20px; color:#ff6b6b;'>
              <h3>カードデータの読み込みに失敗しました</h3>
              <p style='font-size:0.85rem; color:#ccc;'>
                JSONファイル (<b>${jsonFile}</b>) が配置されているか確認してください。
              </p>
            </div>`;
        });
    }

    function changeLivesMode() {
      const val = document.getElementById("lives-select").value;
      if (val === "none") {
        isNoLivesMode = true;
        document.getElementById("lives-display-container").style.display = "none";
        document.getElementById("miss-display-container").style.display = "inline";
      } else {
        isNoLivesMode = false;
        initialLives = parseInt(val, 10);
        if (!isTimerStarted && !isGameOver) {
          lives = initialLives;
        }
        document.getElementById("lives-display-container").style.display = "inline";
        document.getElementById("miss-display-container").style.display = "none";
        updateLivesDisplay();
      }
      saveGameState();
    }

    function toggleStatus(show) {
      const grid = document.getElementById("card-grid");
      if (show) {
        grid.classList.remove("hidden-status");
      } else {
        grid.classList.add("hidden-status");
      }
      saveGameState();
    }

    function changeDisplayMode(mode) {
      const grid = document.getElementById("card-grid");
      grid.classList.remove("mode-hide", "mode-partial", "mode-full");
      grid.classList.add(`mode-${mode}`);

      cardsData.forEach((card, idx) => {
        const imgEl = document.getElementById(`img-${idx}`);
        const folder = getCurrentFolder();
        if (imgEl && !card.isCleared) {
          if (mode === "hide") {
            imgEl.src = `images/${folder}/card_back.jpg`;
          } else {
            imgEl.src = `images/${card.imgPath}`;
          }
        }
      });
      saveGameState();
    }

    // ゲームが開始されているか判定
    function isGameStarted() {
      return isTimerStarted || correctCount > 0 || missCount > 0 || (initialLives !== lives);
    }

    // シリーズ選択のロック・アンロック制御
    function updateControlLockState() {
      const versionSelect = document.getElementById("version-select");
      const livesSelect = document.getElementById("lives-select");
      if (isGameStarted() && !isGameOver) {
        versionSelect.disabled = true;
        livesSelect.disabled = true;
      } else {
        versionSelect.disabled = false;
        livesSelect.disabled = false;
      }
    }

    function saveGameState() {
      if (cardsData.length === 0) return;
      const displayModeEl = document.querySelector('input[name="display-mode"]:checked');
      const state = {
        clearedIds: cardsData.filter(c => c.isCleared).map(c => c.displayNo),
        correctCount: cardsData.filter(c => c.isCleared).length,
        seconds,
        missCount,
        lives,
        initialLives,
        isNoLivesMode,
        isGameOver,
        isTimerStarted,
        livesSelectVal: document.getElementById("lives-select").value,
        displayMode: displayModeEl ? displayModeEl.value : "hide",
        statusShow: !document.getElementById("card-grid").classList.contains("hidden-status"),
        bulkMatch: document.getElementById("bulk-match-checkbox").checked
      };
      localStorage.setItem(getStorageKey(), JSON.stringify(state));
    }

    function loadGameState() {
      const saved = localStorage.getItem(getStorageKey());
      if (!saved) {
        resetStatsOnly();
        updateControlLockState();
        return;
      }
      try {
        const state = JSON.parse(saved);
        seconds = state.seconds || 0;
        missCount = state.missCount || 0;
        initialLives = state.initialLives || 12;
        lives = state.lives !== undefined ? state.lives : initialLives;
        isNoLivesMode = !!state.isNoLivesMode;
        isGameOver = !!state.isGameOver;
        isTimerStarted = !!state.isTimerStarted;

        if (state.livesSelectVal) {
          document.getElementById("lives-select").value = state.livesSelectVal;
          if (state.livesSelectVal !== "none") {
            initialLives = parseInt(state.livesSelectVal, 10);
          }
        }

        if (state.clearedIds && Array.isArray(state.clearedIds)) {
          cardsData.forEach(card => {
            if (state.clearedIds.includes(card.displayNo)) {
              card.isCleared = true;
            }
          });
        }
        
        correctCount = cardsData.filter(c => c.isCleared).length;

        if (state.displayMode) {
          const radio = document.querySelector(`input[name="display-mode"][value="${state.displayMode}"]`);
          if (radio) {
            radio.checked = true;
            changeDisplayMode(state.displayMode);
          }
        }

        const statusRadioVal = state.statusShow ? "show" : "hide";
        const statusRadio = document.querySelector(`input[name="status-toggle"][value="${statusRadioVal}"]`);
        if (statusRadio) {
          statusRadio.checked = true;
          toggleStatus(state.statusShow);
        }

        if (state.bulkMatch !== undefined) {
          document.getElementById("bulk-match-checkbox").checked = state.bulkMatch;
        }

        const inputEl = document.getElementById("name-input");
        if (isGameOver) {
          inputEl.disabled = true;
        } else {
          inputEl.disabled = false;
        }

        if (isTimerStarted && !isGameOver) {
          startTimerIfNeeded(true);
        }

        updateControlLockState();
      } catch(e) {
        console.error(e);
        resetStatsOnly();
        updateControlLockState();
      }
    }

    function resetStatsOnly() {
      correctCount = 0;
      seconds = 0;
      missCount = 0;
      isGameOver = false;
      isTimerStarted = false;
      if (timerInterval) clearInterval(timerInterval);
      const val = document.getElementById("lives-select").value;
      if (val !== "none") {
        initialLives = parseInt(val, 10);
        lives = initialLives;
      }
      changeLivesMode();
    }

    function resetGamePrompt() {
      const seriesSelect = document.getElementById("version-select");
      const seriesName = seriesSelect.options[seriesSelect.selectedIndex].text;
      if (confirm(`「${seriesName}」のゲーム進行状況とタイマーをリセットしますか？`)) {
        localStorage.removeItem(getStorageKey());
        if (timerInterval) clearInterval(timerInterval);
        
        resetStatsOnly();
        cardsData.forEach(c => c.isCleared = false);
        
        const inputEl = document.getElementById("name-input");
        inputEl.disabled = false;
        inputEl.value = "";
        
        document.getElementById("score").innerText = "0";
        document.getElementById("timer").innerText = "00:00";
        document.getElementById("miss-count").innerText = "0";
        
        const currentModeEl = document.querySelector('input[name="display-mode"]:checked');
        const currentMode = currentModeEl ? currentModeEl.value : "hide";
        initGame();
        changeDisplayMode(currentMode);
        updateControlLockState();
      }
    }

    function startTimerIfNeeded(isRestoring = false) {
      if ((!isTimerStarted || isRestoring) && !isGameOver) {
        isTimerStarted = true;

        updateControlLockState();

        if (!isRestoring && timerInterval) clearInterval(timerInterval);

        if (!isRestoring) {
          timerInterval = setInterval(() => {
            seconds++;
            updateTimerDisplay();
            saveGameState();
          }, 1000);
        } else {
          updateTimerDisplay();
          timerInterval = setInterval(() => {
            seconds++;
            updateTimerDisplay();
            saveGameState();
          }, 1000);
        }
      }
    }

    function updateTimerDisplay() {
      const m = String(Math.floor(seconds / 60)).padStart(2, '0');
      const s = String(seconds % 60).padStart(2, '0');
      document.getElementById("timer").innerText = `${m}:${s}`;
    }

    function initGame() {
      const grid = document.getElementById("card-grid");
      grid.innerHTML = "";
      document.getElementById("total-count").innerText = cardsData.length;
      document.getElementById("score").innerText = correctCount;
      document.getElementById("miss-count").innerText = missCount;
      updateTimerDisplay();

      const folder = getCurrentFolder();
      const currentModeEl = document.querySelector('input[name="display-mode"]:checked');
      const currentMode = currentModeEl ? currentModeEl.value : "hide";
      const gunshi = isGunshiMode();
      const ver4 = isVer4Mode();

      cardsData.forEach((card, idx) => {
        const cardEl = document.createElement("div");
        cardEl.className = card.isCleared ? "card cleared" : "card";
        cardEl.id = `card-${idx}`;
        
        let imgSrc = `images/${folder}/card_back.jpg`;
        if (card.isCleared) {
          imgSrc = `images/${card.imgPath}`;
        } else if (currentMode !== "hide") {
          imgSrc = `images/${card.imgPath}`;
        }

        let infoHtml = "";
        if (gunshi) {
          infoHtml = `
            No.${card.displayNo} [${card.rarity}]<br>
            ${card.hiryaku} / ${card.jinryaku}
          `;
        } else if (ver4) {
          infoHtml = `
            No.${card.displayNo} [${card.rarity}]<br>
            武${card.power}/知${card.int}/征${card.seiatsu}/ｺｽﾄ${card.cost}<br>
            【${card.strategy}】
          `;
        } else {
          const attrPart = card.attribute ? `【${card.attribute}】` : "";
          infoHtml = `
            ${attrPart}No.${card.displayNo} [${card.rarity}]<br>
            武${card.power}/知${card.int}/ｺｽﾄ${card.cost}<br>
            【${card.strategy}】
          `;
        }

        cardEl.innerHTML = `
          <div class="card-img-wrapper">
            <img src="${imgSrc}" id="img-${idx}" class="${card.isCleared ? 'cleared-img' : ''}" alt="カード画像">
          </div>
          <div class="card-name" id="name-${idx}">${card.isCleared ? card.bushoName : "???"}</div>
          <div class="card-info">
            ${infoHtml}
          </div>
        `;
        grid.appendChild(cardEl);
      });

      changeLivesMode();
      const inputEl = document.getElementById("name-input");
      if (isGameOver) {
        inputEl.disabled = true;
      } else {
        inputEl.disabled = false;
      }
      updateControlLockState();
    }

    const inputEl = document.getElementById("name-input");
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !isGameOver && cardsData.length > 0) {
        const rawVal = inputEl.value;
        const normVal = normalizeStr(rawVal);
        if (!normVal) return;

        startTimerIfNeeded();

        const isBulk = document.getElementById("bulk-match-checkbox").checked;

        let targetCards = [];
        if (isBulk) {
          targetCards = cardsData.filter(c => !c.isCleared && (normalizeStr(c.bushoName) === normVal || normalizeStr(c.yomiFirst) === normVal));
        } else {
          const single = cardsData
            .filter(c => !c.isCleared && (normalizeStr(c.bushoName) === normVal || normalizeStr(c.yomiFirst) === normVal))
            .sort((a, b) => parseInt(a.displayNo) - parseInt(b.displayNo))[0];
          if (single) targetCards = [single];
        }

        if (targetCards.length > 0) {
          targetCards.forEach(targetCard => {
            targetCard.isCleared = true;
            correctCount++;

            const targetIndex = cardsData.indexOf(targetCard);
            const cardBox = document.getElementById(`card-${targetIndex}`);
            cardBox.classList.add("cleared");
            
            const targetImg = document.getElementById(`img-${targetIndex}`);
            targetImg.src = `images/${targetCard.imgPath}`;
            targetImg.classList.add("cleared-img");

            document.getElementById(`name-${targetIndex}`).innerText = targetCard.bushoName;
          });

          document.getElementById("score").innerText = correctCount;
          inputEl.value = "";

          saveGameState();

          if (correctCount === cardsData.length) {
            endGame(true);
          }
        } else {
          inputEl.value = "";
          document.body.classList.add("wrong-flash");
          setTimeout(() => document.body.classList.remove("wrong-flash"), 300);

          if (isNoLivesMode) {
            missCount++;
            document.getElementById("miss-count").innerText = missCount;
          } else {
            lives--;
            updateLivesDisplay();

            if (lives <= 0) {
              endGame(false);
            }
          }
          saveGameState();
        }
      }
    });

    function updateLivesDisplay() {
      const container = document.getElementById("lives-icons-container");
      container.innerHTML = "";
      const folder = getCurrentFolder();

      for (let i = 0; i < lives; i++) {
        const img = document.createElement("img");
        img.src = `images/${folder}/shiki_active.gif`;
        img.className = "shiki-icon";
        container.appendChild(img);
      }

      const deactiveCount = initialLives - lives;
      for (let i = 0; i < deactiveCount; i++) {
        const img = document.createElement("img");
        img.src = `images/${folder}/shiki_deactive.gif`;
        img.className = "shiki-icon";
        container.appendChild(img);
      }

      const outCount = 12 - initialLives;
      for (let i = 0; i < outCount; i++) {
        const img = document.createElement("img");
        img.src = `images/${folder}/shiki_out.gif`;
        img.className = "shiki-icon";
        container.appendChild(img);
      }
    }

    function endGame(isClear) {
      isGameOver = true;
      if (timerInterval) clearInterval(timerInterval);
      inputEl.disabled = true;
      saveGameState();

      const seriesSelect = document.getElementById("version-select");
      const seriesName = seriesSelect.options[seriesSelect.selectedIndex].text;
      const timeStr = document.getElementById("timer").innerText;
      let msg = "";
      if (isClear) {
        msg = isNoLivesMode 
          ? `🎉 「${seriesName}」全カード 完全クリアおめでとうございます！\nクリアタイム: ${timeStr}\nミス数: ${missCount}回`
          : `🎉 「${seriesName}」全カード 完全クリアおめでとうございます！\nクリアタイム: ${timeStr} (残り残機: ${lives}/${initialLives})`;
      } else {
        msg = `💥 ゲームオーバー...\n正解数: ${correctCount} / ${cardsData.length} 枚\nタイム: ${timeStr}`;
      }
      
      setTimeout(() => {
        if (confirm(`${msg}\n\nX（Twitter）にスコアを投稿しますか？`)) {
          shareOnX(isClear, timeStr, seriesName);
        }
      }, 100);
    }

    function shareOnX(isClear, timeStr, seriesName) {
      const statusText = isClear ? `「${seriesName}」全カード完全クリア！🏆` : `「${seriesName}」結果: ${correctCount}/${cardsData.length}枚正解`;
      const modeText = isNoLivesMode ? `(ミス数: ${missCount}回)` : `(残機: ${lives}/${initialLives})`;
      const text = encodeURIComponent(
        `【三国志大戦 言えるかな？】\n` +
        `${statusText}\n` +
        `⏱ タイム: ${timeStr} ${modeText}\n` +
        `#三国志大戦 #三国志大戦言えるかな\n`
      );
      const url = encodeURIComponent(window.location.href);
      window.open(`https://twitter.com/intent/tweet?text=${text}&url=${url}`, "_blank");
    }

    loadData();
  </script>
</body>
</html>
